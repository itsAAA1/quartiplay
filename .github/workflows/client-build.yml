name: Quartiplay client build
on:
  push:
    branches:
      - fix/untrack-config-secrets-20261106
    paths:
      - 'client/**'
      - 'Dockerfile.client'
      - '.github/workflows/client-build.yml'
  pull_request:
    paths:
      - 'client/**'
      - 'Dockerfile.client'
      - '.github/workflows/client-build.yml'
jobs:
  build-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: client
        run: npm install --no-audit --no-fund
      - name: Build Vite client
        working-directory: client
        run: npm run build
      - name: Verify output
        run: test -f client/dist/index.html
