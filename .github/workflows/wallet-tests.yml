name: Quartiplay wallet regression tests
on:
  pull_request:
    paths:
      - 'server/routes/wallet.js'
      - 'server/money.js'
      - 'tests/**'
      - '.github/workflows/wallet-tests.yml'
  workflow_dispatch:
jobs:
  wallet-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quartiplay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quartiplay_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: quartiplay_test
      JWT_SECRET: only-for-isolated-ci
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime dependencies (no external paid APIs)
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Run decimal and real PostgreSQL integration tests
        run: node --test tests/money.test.js tests/wallet.integration.test.js
